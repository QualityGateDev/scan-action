name: QualityGate Accessibility Scan
description: Run server-authorized web quality checks in pull request CI
author: QualityGate

inputs:
  api_key:
    description: Project-scoped QualityGate API key. Optional for a repository connected through the QualityGate GitHub App when the workflow grants id-token write.
    required: false
  url:
    description: Preview URL to scan
    required: true
  bundle:
    description: Check bundle (a11y, ada, seo, security, links, full, full-runtime, perf, geo, seo-deep, or secrets-exposure). perf runs Lighthouse and installs it on first use; geo and seo-deep are analysed by the QualityGate service on paid plans.
    required: false
    default: a11y
  fail_on:
    description: >-
      Gate thresholds. 'critical=N,serious=N' gates on every finding on the
      page; 'regression' gates only on findings this pull request introduced,
      and 'regression,critical=N' allows N of them.
    required: false
    default: critical=0,serious=0
  fail_on_new:
    description: Set 'true' to count the fail_on limits against findings this pull request introduced only, the same as fail_on regression.
    required: false
    default: 'false'
  baseline_branch:
    description: Branch regression mode compares with, when it is not the default branch. Set it on that branch's push runs too, so they record its baseline.
    required: false
  ignore:
    description: >-
      Request URLs or messages the full-runtime bundle's runtime errors check
      skips, one glob or /regex/ per line, for known environment differences
      such as /cdn-cgi/image/*. Read on the runner, never sent to QualityGate.
    required: false
  budgets:
    description: Experimental lab budgets for the perf bundle, such as 'lcp=2500,cls=0.1,tbt=200' (lcp, cls, tbt, fcp, si, score). Each exceeded budget is a serious finding.
    required: false
  perf_form_factor:
    description: Lighthouse preset for the perf bundle, 'mobile', 'desktop' or 'both'. Defaults to mobile.
    required: false
  preview_username:
    description: Username for a preview protected by HTTP basic auth. Pass it from a secret. Sent only to the preview URL's origin.
    required: false
  preview_password:
    description: Password for a preview protected by HTTP basic auth. Pass it from a secret. Sent only to the preview URL's origin.
    required: false
  preview_headers:
    description: >-
      Extra request headers for a protected preview, one 'Name: value' per
      line, such as a deployment protection bypass token. Pass values from
      secrets. Sent only to the preview URL's origin.
    required: false
  wait_for_url:
    description: Wait for the preview URL to return a successful response
    required: false
    default: 'true'
  wait_timeout:
    description: Maximum preview readiness wait in seconds
    required: false
    default: '120'
  comment:
    description: Create or update the QualityGate pull request comment
    required: false
    default: 'true'
  repository_security:
    description: Opt in to the pilot passive repository dependency scan. Requires a project API key, id-token write permission, and an approved sca_passive profile.
    required: false
    default: 'false'

outputs:
  report_path:
    description: Path of a JSON file with the verdict and every finding, for scripts or `actions/upload-artifact`.

runs:
  using: node24
  main: dist/index.js

branding:
  icon: shield
  color: green
